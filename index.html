<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine ❤️</title>
<style>
   body {
     background: linear-gradient(to right, #ff758c, #ff7eb3);
     height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
     font-family: 'Arial', sans-serif;
     margin: 0;
   }
   .card {
     background: white;
     padding: 40px;
     border-radius: 20px;
     text-align: center;
     box-shadow: 0 10px 30px rgba(0,0,0,0.2);
     width: 300px;
   }
   h1 {
     color: #ff4d6d;
     margin-bottom: 30px;
   }
   .buttons {
     position: relative;
     height: 120px;
   }
   button {
     padding: 12px 25px;
     font-size: 16px;
     border: none;
     border-radius: 30px;
     cursor: pointer;
     position: absolute;
   }
   #yes {
     background: #ff4d6d;
     color: white;
     left: 30px;
     top: 40px;
   }
   #no {
     background: #ccc;
     left: 160px;
     top: 40px;
   }
</style>
</head>
<body>
<div class="card">
<h1>Will you be my Valentine this year? 💖</h1>
<div class="buttons">
<button id="yes" onclick="yesClicked()">Yes ❤️</button>
<button id="no">No 💔</button>
</div>
</div>
<script>
   const noBtn = document.getElementById("no");
   noBtn.addEventListener("mouseover", () => {
     const x = Math.random() * 200;
     const y = Math.random() * 80;
     noBtn.style.left = x + "px";
     noBtn.style.top = y + "px";
   });
   function yesClicked() {
     document.body.innerHTML = `
<div style="
         display:flex;
         align-items:center;
         justify-content:center;
         height:100vh;
         background: linear-gradient(to right, #ff758c, #ff7eb3);
         font-family: Arial;
         color:white;
         text-align:center;
       ">
<h1>Yayyyy!! 😍💘<br>See you on Valentine’s Day ❤️</h1>
</div>
     `;
   }
</script>
</body>
